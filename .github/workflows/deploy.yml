# Manual deploy to Cloudflare (Actions → Deploy → Run workflow). The only way the site is deployed: it does not depend
# on any other repo. Needs the repo secrets CLOUDFLARE_API_TOKEN (Workers + D1 edit) and CLOUDFLARE_ACCOUNT_ID; the
# Worker's own secrets (inbox password, IP salt) are set once with wrangler secret put.
# Order: tests, build, D1 migrations (only the ones not applied yet), then the Worker.
name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:production
      - run: npx wrangler d1 migrations apply apipeline-site --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The Worker's own secrets, copied from the repo's GitHub secrets when set there (skipped when empty; never printed)
      - name: Worker secrets
        run: |
          for name in RESEND_API_KEY IP_SALT INBOX_PASSWORD REQUESTS_WEBHOOK; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name" --env production >/dev/null && echo "set $name"; else echo "skip $name"; fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          IP_SALT: ${{ secrets.IP_SALT }}
          INBOX_PASSWORD: ${{ secrets.INBOX_PASSWORD }}
          REQUESTS_WEBHOOK: ${{ secrets.REQUESTS_WEBHOOK }}
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
